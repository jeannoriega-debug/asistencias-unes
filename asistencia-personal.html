<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistencia de Personal - UNES</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/exceljs@4.3.0/dist/exceljs.min.js"></script>
    <style>
        .badge-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            animation: fadeIn 0.4s ease-out;
        }
        .badge-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .quick-btn {
            transition: all 0.15s;
        }
        .quick-btn:active {
            transform: scale(0.95);
        }
        .section-title {
            position: sticky;
            top: 0;
            z-index: 10;
            backdrop-filter: blur(8px);
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- NAV -->
    <nav class="bg-gradient-to-r from-indigo-700 to-purple-700 text-white shadow-lg sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fas fa-users text-2xl"></i>
                <div>
                    <h1 class="text-xl font-bold">Asistencia de Personal</h1>
                    <p class="text-xs text-indigo-200" id="fecha-actual-display"></p>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <div class="hidden md:block text-right">
                    <span id="profesor-nombre" class="font-semibold text-sm block"></span>
                    <span class="text-xs text-indigo-200">Talento Humano</span>
                </div>
                <button onclick="cerrarSesion()" class="bg-red-500 hover:bg-red-600 px-3 py-2 rounded-lg transition text-sm">
                    <i class="fas fa-sign-out-alt mr-1"></i><span class="hidden sm:inline">Salir</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="container mx-auto px-4 py-6">

        <!-- CONTROLES SUPERIORES -->
        <div class="bg-white rounded-xl shadow-md p-4 mb-6">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-3 mb-3">
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">Fecha:</label>
                    <input type="date" id="fecha-asistencia" 
                           class="w-full p-2 border-2 border-gray-300 rounded-lg focus:border-indigo-500 focus:outline-none text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">Tipo de Personal:</label>
                    <select id="filtro-tipo-personal" onchange="cargarRegistroAsistencia()"
                            class="w-full p-2 border-2 border-gray-300 rounded-lg focus:border-indigo-500 focus:outline-none text-sm">
                        <option value="">Todos los tipos</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">Buscar:</label>
                    <input type="text" id="buscar-personal" placeholder="Nombre o cédula..."
                           onkeyup="if(event.key==='Enter') cargarRegistroAsistencia()"
                           class="w-full p-2 border-2 border-gray-300 rounded-lg focus:border-indigo-500 focus:outline-none text-sm">
                </div>
                <div class="flex items-end gap-2">
                    <button onclick="cargarRegistroAsistencia()" 
                            class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-3 rounded-lg transition text-sm">
                        <i class="fas fa-sync mr-1"></i><span class="hidden sm:inline">Actualizar</span>
                    </button>
                    <button onclick="cargarDatosPersonales()" 
                            class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-3 rounded-lg transition text-sm" title="Agregar Personal">
                        <i class="fas fa-user-plus"></i>
                    </button>
                </div>
            </div>

            <!-- BOTONES DE ACCIÓN Y REPORTES -->
            <div class="flex flex-wrap gap-2 pt-3 border-t mb-3">
                <button onclick="generarReporteDiario()" 
                        class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-4 rounded-lg transition text-sm">
                    <i class="fas fa-file-alt mr-1"></i>Reporte Diario
                </button>
                <button onclick="mostrarModalReportesAvanzados()" 
                        class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition text-sm">
                    <i class="fas fa-chart-bar mr-1"></i>Reportes Avanzados
                </button>
                <button onclick="exportarExcel()" 
                        class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-lg transition text-sm">
                    <i class="fas fa-file-excel mr-1"></i>Exportar Excel
                </button>
            </div>

            <!-- ESTADÍSTICAS RÁPIDAS -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 pt-3 border-t">
                <div class="bg-blue-50 rounded-lg p-2 text-center">
                    <div class="text-2xl font-bold text-blue-600" id="count-total">0</div>
                    <div class="text-xs text-gray-600">Total</div>
                </div>
                <div class="bg-green-50 rounded-lg p-2 text-center">
                    <div class="text-2xl font-bold text-green-600" id="count-presentes">0</div>
                    <div class="text-xs text-gray-600">Presentes</div>
                </div>
                <div class="bg-yellow-50 rounded-lg p-2 text-center">
                    <div class="text-2xl font-bold text-yellow-600" id="count-pendientes">0</div>
                    <div class="text-xs text-gray-600">Pendientes</div>
                </div>
                <div class="bg-red-50 rounded-lg p-2 text-center">
                    <div class="text-2xl font-bold text-red-600" id="count-ausentes">0</div>
                    <div class="text-xs text-gray-600">Ausentes</div>
                </div>
            </div>
        </div>

        <!-- SECCIÓN: PENDIENTES -->
        <div class="mb-8">
            <div class="section-title bg-yellow-50 border-b-2 border-yellow-300 rounded-t-xl p-3 mb-3">
                <div class="flex items-center justify-between">
                    <h2 class="text-lg font-bold text-yellow-800">
                        <i class="fas fa-clock mr-2"></i>Pendientes de Registro
                    </h2>
                    <span class="bg-yellow-200 text-yellow-800 px-3 py-1 rounded-full text-sm font-bold" id="count-pendientes-badge">0</span>
                </div>
            </div>
            <div id="lista-pendientes" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3">
                <!-- Se llena dinámicamente -->
            </div>
        </div>

        <!-- SECCIÓN: REGISTRADOS -->
        <div class="mb-8">
            <div class="section-title bg-green-50 border-b-2 border-green-300 rounded-t-xl p-3 mb-3">
                <div class="flex items-center justify-between">
                    <h2 class="text-lg font-bold text-green-800">
                        <i class="fas fa-check-circle mr-2"></i>Ya Registrados
                    </h2>
                    <span class="bg-green-200 text-green-800 px-3 py-1 rounded-full text-sm font-bold" id="count-registrados-badge">0</span>
                </div>
            </div>
            <div id="lista-registrados" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3">
                <!-- Se llena dinámicamente -->
            </div>
        </div>

    </div>

    <!-- MODAL: REGISTRO DE ASISTENCIA -->
    <div id="modal-registro" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto">
            <div class="sticky top-0 bg-white border-b p-4 flex justify-between items-center rounded-t-2xl">
                <h2 class="text-xl font-bold text-gray-800">
                    <i class="fas fa-user-check text-indigo-600 mr-2"></i>
                    Registrar Asistencia
                </h2>
                <button onclick="cerrarModal('modal-registro')" class="text-gray-500 hover:text-gray-700 text-2xl">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <div class="p-6 space-y-4">
                <!-- Información del personal -->
                <div class="bg-indigo-50 rounded-lg p-3">
                    <div id="modal-personal-info" class="font-bold text-indigo-900"></div>
                    <div id="modal-personal-cedula" class="text-sm text-indigo-700"></div>
                </div>

                <!-- Fecha -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Fecha:</label>
                    <input type="date" id="reg-fecha" class="w-full p-2 border-2 rounded-lg focus:border-indigo-500 focus:outline-none">
                </div>

                <!-- ACCIONES RÁPIDAS -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Acción Rápida:</label>
                    <div class="grid grid-cols-3 gap-2">
                        <button onclick="seleccionarAccionRapida('ASISTENCIA')" 
                                class="quick-btn bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-4 rounded-lg">
                            <div class="text-2xl mb-1">P</div>
                            <div class="text-xs">Presente</div>
                        </button>
                        <button onclick="seleccionarAccionRapida('RETARDO')" 
                                class="quick-btn bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-3 px-4 rounded-lg">
                            <div class="text-2xl mb-1">R</div>
                            <div class="text-xs">Retardo</div>
                        </button>
                        <button onclick="seleccionarAccionRapida('AUS_INJUSTIFICADA')" 
                                class="quick-btn bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-4 rounded-lg">
                            <div class="text-2xl mb-1">A</div>
                            <div class="text-xs">Ausente</div>
                        </button>
                    </div>
                </div>

                <div class="border-t pt-4">
                    <label class="block text-sm font-bold text-gray-700 mb-2">Otras Opciones:</label>
                    <select id="reg-tipo" onchange="cambiarTipoRegistro()" 
                            class="w-full p-2 border-2 rounded-lg focus:border-indigo-500 focus:outline-none">
                        <option value="">Seleccione...</option>
                    </select>
                </div>

                <!-- Campos condicionales -->
                <div id="campos-hora" class="hidden">
                    <label class="block text-sm font-bold text-gray-700 mb-1">Hora:</label>
                    <input type="time" id="reg-hora" class="w-full p-2 border-2 rounded-lg focus:border-indigo-500 focus:outline-none">
                </div>

                <div id="campos-periodo" class="hidden space-y-3">
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-1">Fecha Inicio:</label>
                            <input type="date" id="reg-fecha-inicio" onchange="calcularDias()" 
                                   class="w-full p-2 border-2 rounded-lg focus:border-indigo-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-1">Fecha Fin:</label>
                            <input type="date" id="reg-fecha-fin" onchange="calcularDias()" 
                                   class="w-full p-2 border-2 rounded-lg focus:border-indigo-500 focus:outline-none">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Días Totales:</label>
                        <input type="number" id="reg-dias" min="1" class="w-full p-2 border-2 rounded-lg focus:border-indigo-500 focus:outline-none">
                    </div>
                </div>

                <div id="campos-observaciones" class="hidden">
                    <label class="block text-sm font-bold text-gray-700 mb-1">Observaciones/Motivo:</label>
                    <textarea id="reg-observaciones" rows="3" class="w-full p-2 border-2 rounded-lg focus:border-indigo-500 focus:outline-none" 
                              placeholder="Describa el motivo..."></textarea>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Documento Soporte (opcional):</label>
                    <input type="text" id="reg-documento" class="w-full p-2 border-2 rounded-lg focus:border-indigo-500 focus:outline-none" 
                           placeholder="N° de documento, resolución, etc.">
                </div>

                <!-- Botones -->
                <div class="flex gap-3 pt-4">
                    <button onclick="guardarRegistroAsistencia()" 
                            class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg transition">
                        <i class="fas fa-save mr-2"></i>Guardar
                    </button>
                    <button onclick="cerrarModal('modal-registro')" 
                            class="flex-1 bg-gray-500 hover:bg-gray-600 text-white font-bold py-3 rounded-lg transition">
                        Cancelar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL: REPORTES AVANZADOS -->
    <div id="modal-reportes" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-4xl max-h-[90vh] overflow-y-auto">
            <div class="sticky top-0 bg-white border-b p-4 flex justify-between items-center rounded-t-2xl">
                <h2 class="text-xl font-bold text-gray-800">
                    <i class="fas fa-chart-line text-blue-600 mr-2"></i>
                    Reportes Avanzados
                </h2>
                <button onclick="cerrarModal('modal-reportes')" class="text-gray-500 hover:text-gray-700 text-2xl">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-4">
                <button onclick="generarReporteInasistencias()" 
                        class="bg-red-100 hover:bg-red-200 p-6 rounded-xl text-left transition">
                    <i class="fas fa-user-times text-red-600 text-3xl mb-2"></i>
                    <h3 class="font-bold text-lg">Personal con más Inasistencias</h3>
                    <p class="text-sm text-gray-600">Top 10 de personal con más ausencias</p>
                </button>

                <button onclick="generarReportePermisos()" 
                        class="bg-yellow-100 hover:bg-yellow-200 p-6 rounded-xl text-left transition">
                    <i class="fas fa-file-alt text-yellow-600 text-3xl mb-2"></i>
                    <h3 class="font-bold text-lg">Personal con más Permisos</h3>
                    <p class="text-sm text-gray-600">Análisis de permisos obligatorios y potestativos</p>
                </button>

                <button onclick="generarReporteRetardos()" 
                        class="bg-orange-100 hover:bg-orange-200 p-6 rounded-xl text-left transition">
                    <i class="fas fa-clock text-orange-600 text-3xl mb-2"></i>
                    <h3 class="font-bold text-lg">Personal con Retardos</h3>
                    <p class="text-sm text-gray-600">Registro de llegadas tarde</p>
                </button>

                <button onclick="generarReporteVacaciones()" 
                        class="bg-blue-100 hover:bg-blue-200 p-6 rounded-xl text-left transition">
                    <i class="fas fa-plane text-blue-600 text-3xl mb-2"></i>
                    <h3 class="font-bold text-lg">Personal de Vacaciones</h3>
                    <p class="text-sm text-gray-600">Personal en período vacacional</p>
                </button>
            </div>

            <div class="p-4 border-t flex justify-end">
                <button onclick="cerrarModal('modal-reportes')" 
                        class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-6 rounded-lg">
                    Cerrar
                </button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="assets/js/config.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/modules/asistencia-personal.js"></script>

    <script>
    // Inicialización
    document.addEventListener('DOMContentLoaded', async function() {
        // Establecer fecha de hoy
        const hoy = new Date().toISOString().split('T')[0];
        document.getElementById('fecha-asistencia').value = hoy;
        document.getElementById('reg-fecha').value = hoy;
        
        const now = new Date();
        document.getElementById('reg-hora').value = now.toTimeString().slice(0, 5);

        // Mostrar fecha actual en header
        const opcionesFecha = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('fecha-actual-display').textContent = new Date().toLocaleDateString('es-VE', opcionesFecha);

        // Verificar autenticación
        let intentos = 0;
        const maxIntentos = 20;
        
        const verificarSesion = setInterval(async () => {
            intentos++;
            
            if (window.appState && window.appState.usuarioActualId) {
                clearInterval(verificarSesion);
                
                const nombreEl = document.getElementById('profesor-nombre');
                if (nombreEl) nombreEl.innerText = window.appState.nombreProfesorGlobal;
                
                // Verificar permisos
                const rol = window.appState.rolUsuarioActual?.toLowerCase() || '';
                if (!rol.includes('talentohumano') && !rol.includes('super') && !rol.includes('admin')) {
                    Swal.fire({
                        icon: 'warning',
                        title: 'Acceso Restringido',
                        text: 'No tiene permisos para este módulo',
                        timer: 2500
                    }).then(() => window.location.href = 'panel.html');
                    return;
                }
                
                // Cargar datos
                try {
                    await cargarTiposPersonal();
                    await cargarTiposAsistencia();
                    await cargarRegistroAsistencia();
                    console.log('✅ Módulo inicializado');
                } catch (e) {
                    console.error('❌ Error:', e);
                }
                return;
            }
            
            if (intentos >= maxIntentos) {
                clearInterval(verificarSesion);
                window.location.href = 'panel.html';
            }
        }, 200);
    });

    function cerrarModal(modalId) {
        document.getElementById(modalId).classList.add('hidden');
    }

    function seleccionarAccionRapida(tipoCodigo) {
        window.modules.asistenciaPersonal.seleccionarAccionRapida(tipoCodigo);
    }

    function cambiarTipoRegistro() {
        window.modules.asistenciaPersonal.cambiarTipoRegistro();
    }

    function calcularDias() {
        window.modules.asistenciaPersonal.calcularDias();
    }

    async function cerrarSesion() {
        await window.supabaseClient.auth.signOut();
        window.location.href = 'panel.html';
    }

    // Exportar funciones globales
    window.cargarTiposPersonal = () => window.modules.asistenciaPersonal.cargarTiposPersonal();
    window.cargarTiposAsistencia = () => window.modules.asistenciaPersonal.cargarTiposAsistencia();
    window.cargarRegistroAsistencia = () => window.modules.asistenciaPersonal.cargarRegistroAsistencia();
    window.abrirModalRegistro = (id) => window.modules.asistenciaPersonal.abrirModalRegistro(id);
    window.guardarRegistroAsistencia = () => window.modules.asistenciaPersonal.guardarRegistroAsistencia();
    window.cerrarModal = cerrarModal;
    window.seleccionarAccionRapida = seleccionarAccionRapida;
    window.cambiarTipoRegistro = cambiarTipoRegistro;
    window.calcularDias = calcularDias;
    window.cerrarSesion = cerrarSesion;
    window.generarReporteDiario = () => window.modules.asistenciaPersonal.generarReporteDiario();
    window.mostrarModalReportesAvanzados = () => window.modules.asistenciaPersonal.mostrarModalReportesAvanzados();
    window.generarReporteInasistencias = () => window.modules.asistenciaPersonal.generarReporteInasistencias();
    window.generarReportePermisos = () => window.modules.asistenciaPersonal.generarReportePermisos();
    window.generarReporteRetardos = () => window.modules.asistenciaPersonal.generarReporteRetardos();
    window.generarReporteVacaciones = () => window.modules.asistenciaPersonal.generarReporteVacaciones();
    window.cargarDatosPersonales = () => window.modules.asistenciaPersonal.cargarDatosPersonales();
    window.exportarExcel = () => window.modules.asistenciaPersonal.exportarExcel();
    </script>

</body>
</html>

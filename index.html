<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Asistencia UNES</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</head>

<body class="bg-gray-100 min-h-screen">

    <!-- LOGIN -->
    <div id="login-container" class="fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center z-[100]">
        <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md">
            <h2 class="text-2xl font-bold mb-6 text-center text-blue-700">Iniciar Sesión</h2>
            <input type="email" id="login-email" placeholder="Correo electrónico"
                class="w-full p-3 border rounded-lg mb-4">
            <input type="password" id="login-password" placeholder="Contraseña"
                class="w-full p-3 border rounded-lg mb-6">
            <button onclick="iniciarSesion()"
                class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700 transition">Entrar</button>
            <p id="login-error" class="text-red-500 text-sm mt-4 hidden text-center"></p>
        </div>
    </div>

    <!-- NAV -->
    <nav class="bg-blue-700 text-white p-4 shadow-lg sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center gap-2">
            <h1 class="font-bold text-lg md:text-xl tracking-tight">Asistencia PNF</h1>
            <div id="user-info-container" class="flex items-center gap-4">
                <div class="text-right leading-tight">
                    <span id="profesor-nombre"
                        class="block text-xs font-semibold md:inline md:text-sm">Cargando...</span>
                </div>
                <button onclick="cerrarSesion()"
                    class="bg-red-500 hover:bg-red-600 text-white text-xs px-3 py-1 rounded-lg transition font-bold">Salir</button>
                <button id="btn-admin" onclick="abrirPanelAdmin()"
                    class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs px-3 py-1 rounded-lg transition font-bold hidden">⚙️
                    Admin</button>
            </div>
        </div>
    </nav>

    <main class="container mx-auto p-4">
        <!-- PANEL ADMIN (Sin cambios) -->
        <section id="panel-admin" class="hidden bg-white rounded-xl shadow-md p-6 mb-6">
            <!-- ... (tu código existente del panel admin se mantiene igual) ... -->
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-indigo-700">⚙️ Panel de Administración</h2><button
                    onclick="cerrarPanelAdmin()"><svg class="w-6 h-6" fill="none" stroke="currentColor"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                        </path>
                    </svg></button>
            </div>
            <p class="text-center text-gray-500 py-8">El panel de administración se mantiene igual. Los cambios aplican
                solo a la cascada de asistencia.</p>
        </section>

        <!-- SECCIÓN PRINCIPAL DE ASISTENCIA -->
        <section class="bg-white rounded-xl shadow-md p-6 mb-6">
            <!-- FILTROS EN CASCADA (ORDEN SOLICITADO) -->
            <!-- 1. PNF → 2. CATEGORÍA → 3. UNIDAD CURRICULAR → 4. PROCESO → 5. TRAYECTO → 6. AMBIENTE → 7. ESTATUS → 8. GÉNERO -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
                <select id="select-pnf" class="border p-2 rounded-lg w-full bg-gray-50 text-sm"
                    onchange="onPnfChangeAsistencia()">
                    <option value="">Seleccione PNF</option>
                </select>
                <select id="select-categoria" class="border p-2 rounded-lg w-full bg-gray-50 text-sm"
                    onchange="onCategoriaChangeAsistencia()">
                    <option value="">Todas las categorías</option>
                </select>
                <select id="select-materia" class="border p-2 rounded-lg w-full bg-gray-50 text-sm"
                    onchange="onMateriaChangeAsistencia()">
                    <option value="">Seleccione Unidad Curricular</option>
                </select>
                <select id="select-proceso" class="border p-2 rounded-lg w-full bg-gray-50 text-sm"
                    onchange="onProcesoChangeAsistencia()">
                    <option value="">Seleccione Proceso</option>
                </select>
                <select id="select-trayecto" class="border p-2 rounded-lg w-full bg-gray-50 text-sm"
                    onchange="onTrayectoChangeAsistencia()">
                    <option value="">Seleccione Trayecto</option>
                </select>
                <select id="select-ambiente" class="border p-2 rounded-lg w-full bg-gray-50 text-sm"
                    onchange="onAmbienteChangeAsistencia()">
                    <option value="">Seleccione Ambiente</option>
                </select>
                <select id="select-status-asist" class="border p-2 rounded-lg w-full bg-gray-50 text-sm"
                    onchange="onStatusChangeAsistencia()">
                    <option value="">Todos los estados</option>
                </select>
                <select id="select-genero" class="border p-2 rounded-lg w-full bg-gray-50 text-sm"
                    onchange="onGeneroChangeAsistencia()">
                    <option value="">Todos los géneros</option>
                </select>
            </div>

            <!-- BOTONES -->
            <div class="flex flex-col md:flex-row gap-3 mt-4 border-t pt-4">
                <button id="btn-cargar"
                    class="bg-blue-600 text-white py-2 px-4 rounded-lg font-bold text-sm hover:bg-blue-800 transition flex-1">Cargar
                    Lista</button>
                <button id="btn-reporte"
                    class="bg-purple-600 text-white py-2 px-4 rounded-lg font-bold text-sm hover:bg-purple-800 transition flex-1">Reporte
                    Matriz</button>
            </div>
        </section>

        <!-- LISTA DE ESTUDIANTES -->
        <section id="lista-contenedor" class="hidden">
            <!-- 📊 BARRA DE TOTALES (Alineados a la izquierda) -->
            <div id="resumen-estudiantes"
                class="flex flex-col sm:flex-row gap-2 sm:gap-6 bg-blue-50 border border-blue-200 rounded-lg p-3 mb-3 text-sm font-semibold text-blue-800 shadow-sm">
                <span>✅ Activos: <span id="count-activos">0</span></span>
                <span>⛔ Baja: <span id="count-bajas">0</span></span>
                <span>👥 Total: <span id="count-total">0</span></span>
            </div>

            <div id="estudiantes-body" class="bg-white shadow-md rounded-lg divide-y"></div>
        </section>

    </main>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/components/tablas.js"></script>
    <script src="assets/js/modules/asistencia.js"></script>
    <script src="assets/js/modules/admin.js"></script>
    <script src="assets/js/modules/reportes.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Gestión Estudiantes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body class="bg-gray-50 min-h-screen">

    <!-- NAV -->
    <nav class="bg-indigo-700 text-white p-4 shadow-lg sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="font-bold text-lg">📈 Dashboard de Estudiantes</h1>
            <div class="flex items-center gap-4">
                <button onclick="window.location.href='gestion-estudiantes.html'"
                    class="bg-indigo-600 hover:bg-indigo-800 px-3 py-1 rounded text-sm transition">
                    ← Volver a Gestión
                </button>
                <button onclick="window.location.href='index.html'"
                    class="bg-gray-600 hover:bg-gray-700 px-3 py-1 rounded text-sm transition">
                    🏠 Inicio
                </button>
                <button onclick="cerrarSesion()"
                    class="bg-red-500 hover:bg-red-600 px-3 py-1 rounded text-sm transition">
                    Salir
                </button>
            </div>
        </div>
    </nav>

    <main class="container mx-auto p-6">

        <!-- FILTROS RÁPIDOS -->
        <section class="bg-white rounded-xl shadow-md p-4 mb-6">
            <h3 class="font-bold text-gray-700 mb-3">🔍 Filtros de Visualización</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                <select id="dash-pnf" class="border p-2 rounded text-sm" onchange="window.dashboard.cargarDatos()">
                    <option value="">Todos los PNF</option>
                </select>
                <select id="dash-proceso" class="border p-2 rounded text-sm" onchange="window.dashboard.cargarDatos()">
                    <option value="">Todos los Procesos</option>
                </select>
                <select id="dash-categoria" class="border p-2 rounded text-sm"
                    onchange="window.dashboard.cargarDatos()">
                    <option value="">Todas las Categorías</option>
                </select>
                <select id="dash-trayecto" class="border p-2 rounded text-sm" onchange="window.dashboard.cargarDatos()">
                    <option value="">Todos los Trayectos</option>
                </select>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mt-4">
                <select id="dash-genero" class="border p-2 rounded text-sm" onchange="window.dashboard.cargarDatos()">
                    <option value="">Todos los Géneros</option>
                </select>
                <select id="dash-ambiente" class="border p-2 rounded text-sm" onchange="window.dashboard.cargarDatos()">
                    <option value="">Todos los Ambientes</option>
                </select>
                <select id="dash-status" class="border p-2 rounded text-sm" onchange="window.dashboard.cargarDatos()">
                    <option value="">Todos los Estados</option>
                    <option value="Activo">✅ Activos</option>
                    <option value="Inactivo">❌ Inactivos</option>
                </select>
            </div>
        </section>

        <!-- TARJETAS DE MÉTRICAS (KPIs) -->
        <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
            <!-- Total -->
            <div class="bg-white p-6 rounded-xl shadow border-l-4 border-indigo-500">
                <p class="text-gray-500 text-sm font-bold uppercase">Total Estudiantes</p>
                <h2 class="text-4xl font-bold text-gray-800 mt-2" id="kpi-total">0</h2>
            </div>
            <!-- Activos -->
            <div class="bg-white p-6 rounded-xl shadow border-l-4 border-green-500">
                <p class="text-gray-500 text-sm font-bold uppercase">Estudiantes Activos</p>
                <h2 class="text-4xl font-bold text-green-600 mt-2" id="kpi-activos">0</h2>
            </div>
            <!-- Inactivos -->
            <div class="bg-white p-6 rounded-xl shadow border-l-4 border-red-500">
                <p class="text-gray-500 text-sm font-bold uppercase">Estudiantes Inactivos</p>
                <h2 class="text-4xl font-bold text-red-600 mt-2" id="kpi-inactivos">0</h2>
            </div>
            <!-- Ambientes -->
            <div class="bg-white p-6 rounded-xl shadow border-l-4 border-blue-500">
                <p class="text-gray-500 text-sm font-bold uppercase">Ambientes Activos</p>
                <h2 class="text-4xl font-bold text-blue-600 mt-2" id="kpi-ambientes">0</h2>
            </div>
        </section>

        <!-- GRÁFICOS -->
        <section class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
            <!-- Gráfico Género -->
            <div class="bg-white p-6 rounded-xl shadow">
                <h3 class="font-bold text-gray-700 mb-4 text-center">Distribución por Género</h3>
                <div class="h-64 relative">
                    <canvas id="chart-genero"></canvas>
                </div>
            </div>

            <!-- Gráfico Trayecto -->
            <div class="bg-white p-6 rounded-xl shadow">
                <h3 class="font-bold text-gray-700 mb-4 text-center">Estudiantes por Trayecto</h3>
                <div class="h-64 relative">
                    <canvas id="chart-trayecto"></canvas>
                </div>
            </div>

            <!-- Gráfico Categoría -->
            <div class="bg-white p-6 rounded-xl shadow">
                <h3 class="font-bold text-gray-700 mb-4 text-center">Estudiantes por Categoría</h3>
                <div class="h-64 relative">
                    <canvas id="chart-categoria"></canvas>
                </div>
            </div>

            <!-- Gráfico Ambientes -->
            <div class="bg-white p-6 rounded-xl shadow">
                <h3 class="font-bold text-gray-700 mb-4 text-center">Estudiantes por Ambiente</h3>
                <div class="h-64 relative">
                    <canvas id="chart-ambiente"></canvas>
                </div>
            </div>
        </section>

    </main>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/dashboard.js"></script>

</body>

</html>
